name: release

# vX.Y.Z 태그를 푸시하면 자기완결 설치 파일을 빌드해 GitHub Release 로 올린다.
# 버전은 태그에서 결정된다(build-installer.ps1 -Version).
#
# 수동 실행(Actions > release > Run workflow)은 시험용이다: 같은 단계로 인스톨러를 빌드하되 릴리스를 만들지 않고
# 워크플로 아티팩트로만 올린다(버전은 csproj 값). 태그를 밀기 전에 러너에서 빌드·서명이 되는지 확인할 때 쓴다.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # 릴리스 생성 + 자산 업로드

jobs:
  release:
    # windows-2022 이미지에는 NSIS 3.10 이 내장돼 있다(windows-latest=windows-2025 에는 없음).
    # choco 피드(503)와 SourceForge(429/403)가 모두 불안정해 v0.11.0 릴리스가 두 번 실패한 뒤 고정했다.
    # 아래 "Install NSIS" 단계는 내장 makensis 를 찾으면 아무것도 하지 않고, 없을 때만 설치를 시도한다.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Makensis {
            $c = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            foreach ($p in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")) {
              if (Test-Path $p) { return $p }
            }
            return $null
          }
          # choco community 피드가 간헐적으로 실패한다(503, "Value cannot be null. Parameter name: packageStream").
          # 게다가 패키지를 못 찾아도 exit code 0 을 돌려주므로("installed 0/0", v0.11.0 릴리스에서 실제 발생)
          # 종료 코드가 아니라 makensis.exe 가 실제로 생겼는지로 판정한다. 3회 후에도 없으면
          # SourceForge 에서 NSIS portable 을 직접 받아 PATH 에 추가한다.
          $found = Find-Makensis
          for ($i = 1; $i -le 3 -and -not $found; $i++) {
            choco install nsis -y --no-progress
            $found = Find-Makensis
            if (-not $found) {
              Write-Host "::warning::'choco install nsis' 시도 $i 후에도 makensis.exe 없음."
              if ($i -lt 3) { Start-Sleep -Seconds 15 }
            }
          }
          if (-not $found) {
            $ver = '3.10'
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            $dst = Join-Path $env:RUNNER_TEMP 'nsis'
            Write-Host "choco 실패 → SourceForge 에서 NSIS $ver portable 직접 설치"
            Invoke-WebRequest -UseBasicParsing -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$ver/nsis-$ver.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dst -Force
            $dir = Join-Path $dst "nsis-$ver"
            $found = Join-Path $dir 'makensis.exe'
            if (-not (Test-Path $found)) { throw "NSIS portable 압축 해제 후에도 makensis.exe 없음: $dir" }
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          Write-Host "makensis = $found"

      # Windows 11 새 우클릭 메뉴용 스파스 패키지(.msix)는 자체 서명 인증서로 서명한다. 개인 키는 시크릿에만 있다
      # (Installer/publish-signing-secrets.ps1 로 등록). 시크릿이 없으면 build-package.ps1 이 패키지를 건너뛰고
      # 인스톨러는 새 메뉴 옵션 없이 만들어진다 — 릴리스는 실패하지 않지만 경고를 남긴다.
      - name: Import package signing certificate
        shell: pwsh
        env:
          MSIX_CERT_PFX: ${{ secrets.MSIX_CERT_PFX }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_CERT_PFX) {
            Write-Host "::warning::MSIX_CERT_PFX 시크릿이 없습니다 → Windows 11 새 메뉴 패키지 없이 빌드합니다."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX))
          try {
            $password = ConvertTo-SecureString $env:MSIX_CERT_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          }
          finally { Remove-Item $pfx -Force }

      - name: Build self-contained installer
        shell: pwsh
        env:
          # 태그 이름은 스크립트 본문에 끼워 넣지 않고 환경 변수로 넘긴다(이름에 든 문자가 코드로 해석되지 않게).
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') { ./Installer/build-installer.ps1 -Version $env:REF_NAME }
          else { ./Installer/build-installer.ps1 }

      # 서명이 끝났으면 개인 키를 러너에서 바로 지운다 — 뒤따르는 서드파티 액션이 키에 닿지 못하게.
      - name: Remove package signing certificate
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq 'CN=akon47' | Remove-Item -DeleteKey -ErrorAction SilentlyContinue

      # 시크릿이 있는데도 패키지가 빠졌다면(서명·도구 문제) 새 메뉴가 조용히 사라진 릴리스가 나가므로 여기서 막는다.
      - name: Verify sparse package
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.MSIX_CERT_PFX != '' }}
        run: |
          if ($env:HAS_CERT -eq 'true' -and -not (Test-Path publish/win-x64/shell/Claude-Account-Switcher.msix)) {
            throw '서명 인증서가 있는데 스파스 패키지가 만들어지지 않았습니다.'
          }

      - name: Upload installer (manual run only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Claude-Account-Switcher-Setup_v*.exe
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Claude-Account-Switcher-Setup_v*.exe

  # winget-pkgs 로 매니페스트 갱신 PR 자동 생성.
  # 같은 워크플로 실행 안에서 돌려야 한다(GITHUB_TOKEN 으로 만든 릴리스는 release 이벤트를
  # 트리거하지 못하므로 별도 워크플로로는 자동 실행되지 않는다).
  # 사전 준비(1회): 저장소 변수 PUBLISH_WINGET=true + 시크릿 WINGET_TOKEN(winget-pkgs fork 가능한 PAT).
  # (secrets 는 job if 에서 못 쓰므로 vars 로 게이트한다.)
  winget:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_WINGET == 'true' && github.ref_type == 'tag' }}
    # 최초 1회 winget-pkgs 등록 전에는 실패하는 게 정상이므로 릴리스 런을 빨갛게 만들지 않는다.
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: akon47.ClaudeAccountSwitcher
          release-tag: ${{ github.ref_name }}
          # 파일명의 -x64 로 komac 이 아키텍처를 x64 로 인식한다(NSIS 스텁은 x86 PE 라 파일 분석만으론 오검지).
          installers-regex: 'Setup_v[\d.]+-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
