name: release

# vX.Y.Z 태그를 푸시하면 자기완결 설치 파일을 빌드해 GitHub Release 로 올린다.
# 버전은 태그에서 결정된다(build-installer.ps1 -Version).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # 릴리스 생성 + 자산 업로드

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Makensis {
            $c = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            foreach ($p in @("${env:ProgramFiles(x86)}NSISmakensis.exe", "$env:ProgramFilesNSISmakensis.exe")) {
              if (Test-Path $p) { return $p }
            }
            return $null
          }
          # choco community 피드가 간헐적으로 실패한다(503, "Value cannot be null. Parameter name: packageStream").
          # 게다가 패키지를 못 찾아도 exit code 0 을 돌려주므로("installed 0/0", v0.11.0 릴리스에서 실제 발생)
          # 종료 코드가 아니라 makensis.exe 가 실제로 생겼는지로 판정한다. 3회 후에도 없으면
          # SourceForge 에서 NSIS portable 을 직접 받아 PATH 에 추가한다.
          $found = Find-Makensis
          for ($i = 1; $i -le 3 -and -not $found; $i++) {
            choco install nsis -y --no-progress
            $found = Find-Makensis
            if (-not $found) {
              Write-Host "::warning::'choco install nsis' 시도 $i 후에도 makensis.exe 없음."
              if ($i -lt 3) { Start-Sleep -Seconds 15 }
            }
          }
          if (-not $found) {
            $ver = '3.10'
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            $dst = Join-Path $env:RUNNER_TEMP 'nsis'
            Write-Host "choco 실패 → SourceForge 에서 NSIS $ver portable 직접 설치"
            Invoke-WebRequest -UseBasicParsing -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/$ver/nsis-$ver.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dst -Force
            $dir = Join-Path $dst "nsis-$ver"
            $found = Join-Path $dir 'makensis.exe'
            if (-not (Test-Path $found)) { throw "NSIS portable 압축 해제 후에도 makensis.exe 없음: $dir" }
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          Write-Host "makensis = $found"

      - name: Build self-contained installer
        shell: pwsh
        run: ./Installer/build-installer.ps1 -Version "${{ github.ref_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Claude-Account-Switcher-Setup_v*.exe

  # winget-pkgs 로 매니페스트 갱신 PR 자동 생성.
  # 같은 워크플로 실행 안에서 돌려야 한다(GITHUB_TOKEN 으로 만든 릴리스는 release 이벤트를
  # 트리거하지 못하므로 별도 워크플로로는 자동 실행되지 않는다).
  # 사전 준비(1회): 저장소 변수 PUBLISH_WINGET=true + 시크릿 WINGET_TOKEN(winget-pkgs fork 가능한 PAT).
  # (secrets 는 job if 에서 못 쓰므로 vars 로 게이트한다.)
  winget:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_WINGET == 'true' }}
    # 최초 1회 winget-pkgs 등록 전에는 실패하는 게 정상이므로 릴리스 런을 빨갛게 만들지 않는다.
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: akon47.ClaudeAccountSwitcher
          release-tag: ${{ github.ref_name }}
          # 파일명의 -x64 로 komac 이 아키텍처를 x64 로 인식한다(NSIS 스텁은 x86 PE 라 파일 분석만으론 오검지).
          installers-regex: 'Setup_v[\d.]+-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
